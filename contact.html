<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

.container{
    width:90%;
    max-width:1100px;
    margin:60px auto;
}

.title{
    text-align:center;
    color:white;
    margin-bottom:40px;
}

.title h1{
    font-size:48px;
    margin-bottom:10px;
}

.title p{
    color:#d1d5db;
}

.contact-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.info{
    background:#2563eb;
    color:white;
    padding:50px;
}

.info h2{
    margin-bottom:20px;
}

.info p{
    margin-bottom:20px;
    line-height:1.8;
}

.form{
    padding:50px;
}

.form h2{
    margin-bottom:20px;
    color:#0f172a;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

textarea{
    resize:none;
    height:140px;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

footer{
    text-align:center;
    color:white;
    margin-top:40px;
    padding-bottom:20px;
}

@media(max-width:768px){

.contact-box{
grid-template-columns:1fr;
}

.title h1{
font-size:38px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="title">

<h1>Contact Us</h1>

<p>Let's discuss your next project.</p>

</div>

<div class="contact-box">

<div class="info">

<h2>Get In Touch</h2>

<p>📍 Rawalakot, Azad Kashmir</p>

<p>📧 azhar@example.com</p>

<p>📞 +92 300 1234567</p>

<p>
Feel free to contact us for website development,
WordPress, UI/UX Design, or any digital solution.
</p>

</div>

<div class="form">

<h2>Send Message</h2>

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Email Address">

<input type="text" placeholder="Subject">

<textarea placeholder="Write your message"></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

<footer>

© 2026 CreateByAzhar | Contact Page

</footer>

</div>

</body>
</html>
